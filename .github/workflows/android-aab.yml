name: Build Android AAB
on:
  push:
    branches: [build/android-aab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: adwall-app
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adwall-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install clean dependencies
        run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Use submitter-owned upload signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          // The recipient signs the bundle using their own Play upload key.
          android.buildTypes.release.signingConfig = null
          GRADLE
      - name: Compile release app bundle
        working-directory: adwall-app/android
        run: ./gradlew :app:bundleRelease --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g' --console=plain
      - name: Validate and package bundle
        run: |
          mkdir -p release-artifact
          cp android/app/build/outputs/bundle/release/app-release.aab release-artifact/adwallindia-unsigned.aab
          cp PLAY_STORE_HANDOFF.md release-artifact/PLAY_STORE_HANDOFF.md
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          bundle=Path('release-artifact/adwallindia-unsigned.aab')
          with zipfile.ZipFile(bundle) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert 'base/manifest/AndroidManifest.xml' in names
              assert 'BundleConfig.pb' in names
              assert not any(n.startswith('META-INF/') and n.upper().endswith(('.RSA','.DSA','.EC')) for n in names)
          digest=hashlib.sha256(bundle.read_bytes()).hexdigest()
          Path('release-artifact/SHA256SUMS.txt').write_text(f'{digest}  {bundle.name}\n')
          print(f'Validated unsigned Android App Bundle: {bundle.stat().st_size} bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adwallindia-aab-handoff
          path: adwall-app/release-artifact/
          if-no-files-found: error
          retention-days: 30
